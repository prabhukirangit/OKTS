<svg xmlns="http://www.w3.org/2000/svg" width="680" height="616" viewBox="0 0 680 616" role="img" aria-label="OKTS four-layer architecture">
  <title>OKTS four-layer architecture</title>
  <desc>Sources feed adapters, which produce OKT concepts; an enrich and auto-link step fattens the retrieval text and derives the graph and hierarchy; a retrieval layer ranks over the cross-linked descriptor bundle; a serving layer exposes three meta-tools to the agent.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
    .sub { font-size: 12.5px; fill: #475569; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="60" y="30" width="560" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="title" x="340" y="50" text-anchor="middle">Sources</text>
  <text class="sub" x="340" y="67" text-anchor="middle">MCP · functions · agents · HTTP/OpenAPI · search APIs</text>
  <line class="edge" x1="340" y1="80" x2="340" y2="106" marker-end="url(#arrow)"/>

  <rect x="60" y="108" width="560" height="56" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="title" x="340" y="131" text-anchor="middle">1 · Adapters (producers)</text>
  <text class="sub" x="340" y="149" text-anchor="middle">normalize each source into OKT</text>
  <line class="edge" x1="340" y1="166" x2="340" y2="192" marker-end="url(#arrow)"/>

  <rect x="60" y="194" width="560" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="title" x="340" y="217" text-anchor="middle">1½ · Enrich + auto-link</text>
  <text class="sub" x="340" y="235" text-anchor="middle">fatten body · derive graph + hierarchy</text>
  <line class="edge" x1="340" y1="252" x2="340" y2="278" marker-end="url(#arrow)"/>

  <rect x="60" y="280" width="560" height="56" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="title" x="340" y="303" text-anchor="middle">2 · OKT descriptor</text>
  <text class="sub" x="340" y="321" text-anchor="middle">tool concepts, cross-linked into a graph</text>
  <line class="edge" x1="340" y1="338" x2="340" y2="364" marker-end="url(#arrow)"/>

  <rect x="60" y="366" width="560" height="56" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text class="title" x="340" y="389" text-anchor="middle">3 · Retrieval</text>
  <text class="sub" x="340" y="407" text-anchor="middle">hybrid rank + hierarchy + graph expand</text>
  <line class="edge" x1="340" y1="424" x2="340" y2="450" marker-end="url(#arrow)"/>

  <rect x="60" y="452" width="560" height="56" rx="10" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5"/>
  <text class="title" x="340" y="475" text-anchor="middle">4 · Serving</text>
  <text class="sub" x="340" y="493" text-anchor="middle">search_tools · load_tool · call_tool</text>
  <line class="edge" x1="340" y1="510" x2="340" y2="536" marker-end="url(#arrow)"/>

  <rect x="60" y="538" width="560" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="title" x="340" y="558" text-anchor="middle">Agent</text>
  <text class="sub" x="340" y="575" text-anchor="middle">sees 3 meta-tools, not 300 schemas</text>
</svg>
