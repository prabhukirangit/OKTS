<svg xmlns="http://www.w3.org/2000/svg" width="680" height="446" viewBox="0 0 680 446" role="img" aria-label="Runtime flow: search, load, call">
  <title>OKTS runtime flow: search, load, call</title>
  <desc>An agent query flows through three phases — search ranks on prose, load fetches the schema, call validates and dispatches to the real tool.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
    .sub { font-size: 12.5px; fill: #475569; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="190" y="30" width="300" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="title" x="340" y="53" text-anchor="middle">Agent query</text>
  <text class="sub" x="340" y="71" text-anchor="middle">"open a github issue"</text>
  <line class="edge" x1="340" y1="88" x2="340" y2="108" marker-end="url(#arrow)"/>

  <rect x="190" y="110" width="300" height="56" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="title" x="340" y="133" text-anchor="middle">1 · search_tools</text>
  <text class="sub" x="340" y="151" text-anchor="middle">ranks on description + body</text>
  <line class="edge" x1="340" y1="168" x2="340" y2="188" marker-end="url(#arrow)"/>

  <rect x="190" y="190" width="300" height="56" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="title" x="340" y="213" text-anchor="middle">2 · load_tool</text>
  <text class="sub" x="340" y="231" text-anchor="middle">injects input_schema</text>
  <line class="edge" x1="340" y1="248" x2="340" y2="268" marker-end="url(#arrow)"/>

  <rect x="190" y="270" width="300" height="56" rx="10" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5"/>
  <text class="title" x="340" y="293" text-anchor="middle">3 · call_tool</text>
  <text class="sub" x="340" y="311" text-anchor="middle">validates, then dispatches</text>
  <line class="edge" x1="340" y1="328" x2="340" y2="348" marker-end="url(#arrow)"/>

  <rect x="190" y="350" width="300" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="title" x="340" y="373" text-anchor="middle">Real tool</text>
  <text class="sub" x="340" y="391" text-anchor="middle">MCP / function / endpoint</text>
</svg>
